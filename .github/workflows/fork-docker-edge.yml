# Fork-only edge image — based on upstream's `.github/workflows/docker-unstable.yml`
#
# Upstream only builds Docker images on `v*` tags (docker-publish.yml) or once a day
# (docker-unstable.yml, cron `17 3 * * *`). This fork wants an image as soon as a
# commit lands on its own `unstable` branch.
#
# The pipeline is upstream's docker-unstable.yml, kept structurally identical: same
# `prepare` job pinning one commit SHA, same native amd64/arm64 matrix
# (ubuntu-latest + ubuntu-24.04-arm, no QEMU emulation), same buildx + manifest flow,
# same action versions. Only these differ:
#
#   1. trigger   — `push` to this fork's `unstable` (+ manual), not a daily cron.
#   2. registry  — GHCR via the built-in GITHUB_TOKEN, because this fork has no
#                  DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets configured.
#   3. tags      — `edge-*` instead of `unstable-*`, so it can never collide with the
#                  official `looplj/axonhub` images.
#   4. VERSION   — upstream stamps `<base>-unstable.<YYYYMMDD>`; we add the short SHA
#                  so several commits built the same day stay distinguishable.
#   5. prepare   — `ubuntu-latest` instead of `ubuntu-slim` (that label's availability
#                  on fork repos is not guaranteed; the job is trivial either way).
#
# Tags produced:
#   ghcr.io/<owner>/axonhub:edge-<sha7>   immutable, one per commit
#   ghcr.io/<owner>/axonhub:edge          rolling, newest commit on unstable
#   ...:edge-<sha7>-{amd64,arm64} and ...:edge-{amd64,arm64}   per-arch intermediates

name: Publish Docker image (fork edge)

on:
  push:
    branches:
      - unstable
  workflow_dispatch:

# A newer push supersedes an in-flight build of an older commit.
concurrency:
  group: fork-edge-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/axonhub

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Pin commit & version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      commit_sha: ${{ steps.pin.outputs.commit_sha }}
      short_sha: ${{ steps.pin.outputs.short_sha }}
      base_version: ${{ steps.pin.outputs.base_version }}
      build_date: ${{ steps.pin.outputs.build_date }}
    steps:
      - name: Check out unstable
        uses: actions/checkout@v7
        with:
          ref: unstable
          fetch-depth: 1
          persist-credentials: false

      - name: Pin commit SHA & version
        id: pin
        run: |
          git fetch --tags --force --depth=1
          BASE_VERSION=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=$(cat internal/build/VERSION 2>/dev/null || true)
          fi
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=v0.0.0
          fi
          if ! printf '%s\n' "$BASE_VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "Invalid base version: $BASE_VERSION" >&2
            exit 1
          fi
          printf 'commit_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          printf 'short_sha=%s\n' "$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          printf 'base_version=%s\n' "$BASE_VERSION" >> "$GITHUB_OUTPUT"
          printf 'build_date=%s\n' "$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "Pinned $(git rev-parse HEAD) at $BASE_VERSION"

  build_single_arch:
    name: Build & push (${{ matrix.arch }}) [native]
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    permissions:
      packages: write
      contents: read

    steps:
      - name: Check out pinned commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Write VERSION
        env:
          BASE_VERSION: ${{ needs.prepare.outputs.base_version }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: printf '%s\n' "${BASE_VERSION}-unstable.${SHORT_SHA}" > internal/build/VERSION

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE }}

      - name: Build & push single-arch
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.IMAGE }}:edge-${{ needs.prepare.outputs.short_sha }}-${{ matrix.arch }}
            ${{ env.IMAGE }}:edge-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  create_manifests:
    name: Create multi-arch manifest (GHCR)
    needs: [prepare, build_single_arch]
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create & push manifest (immutable per-commit)
        env:
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:edge-${SHORT_SHA}" \
            "$IMAGE:edge-${SHORT_SHA}-amd64" \
            "$IMAGE:edge-${SHORT_SHA}-arm64"

      - name: Create & push manifest (rolling edge)
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:edge" \
            "$IMAGE:edge-amd64" \
            "$IMAGE:edge-arm64"

      - name: Summary
        env:
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          BASE_VERSION: ${{ needs.prepare.outputs.base_version }}
          BUILD_DATE: ${{ needs.prepare.outputs.build_date }}
        run: |
          {
            echo "### Edge image published"
            echo ""
            echo "| tag | value |"
            echo "| --- | --- |"
            echo "| rolling | \`$IMAGE:edge\` |"
            echo "| immutable | \`$IMAGE:edge-${SHORT_SHA}\` |"
            echo "| commit | \`${SHORT_SHA}\` |"
            echo "| embedded version | \`${BASE_VERSION}-unstable.${SHORT_SHA}\` |"
            echo "| build date | \`${BUILD_DATE}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
